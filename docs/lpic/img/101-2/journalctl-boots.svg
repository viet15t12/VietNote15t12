<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="journalctl --list-boots">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="760" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380.0" y="34" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">journalctl --list-boots</text>
<text x="380.0" y="55" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#475569">Chỉ số lần khởi động tương đối so với lần hiện tại</text>
<rect x="40" y="90" width="210" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="145" y="122" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#64748b">-b -2</text>
<text x="145" y="146" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Two boots ago</text>
<text x="145" y="164" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Hai lần khởi động trước</text>
<text x="145" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">journalctl -b -2</text>
<line x1="252" y1="140" x2="273" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="275" y="90" width="210" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="380" y="122" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#d97706">-b -1</text>
<text x="380" y="146" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Previous boot</text>
<text x="380" y="164" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Lần khởi động trước</text>
<text x="380" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">journalctl -b -1</text>
<line x1="487" y1="140" x2="508" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="510" y="90" width="210" height="100" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
<text x="615" y="122" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#059669">-b 0</text>
<text x="615" y="146" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Current boot</text>
<text x="615" y="164" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Lần khởi động hiện tại</text>
<text x="615" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">journalctl -b 0</text>
</svg>
