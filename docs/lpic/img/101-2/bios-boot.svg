<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-label="BIOS boot flow">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="720" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="360.0" y="34" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">BIOS boot flow</text>
<text x="360.0" y="55" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#475569">Luồng khởi động bằng BIOS</text>
<rect x="40" y="80" width="440" height="58" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="64" cy="109.0" r="13" fill="#2563eb"/><text x="64" y="114.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="284.0" y="106.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e293b">POST (power-on self-test)</text>
<text x="284.0" y="126.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Tự kiểm tra khi bật nguồn</text>
<line x1="260.0" y1="138" x2="260.0" y2="161" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="164" width="440" height="58" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="64" cy="193.0" r="13" fill="#2563eb"/><text x="64" y="198.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="284.0" y="190.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Activate video, keyboard, storage</text>
<text x="284.0" y="210.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Kích hoạt video, bàn phím, ổ lưu trữ</text>
<line x1="260.0" y1="222" x2="260.0" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="248" width="440" height="58" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="64" cy="277.0" r="13" fill="#2563eb"/><text x="64" y="282.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="284.0" y="274.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Load stage 1 from MBR</text>
<text x="284.0" y="294.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Nạp bootloader giai đoạn 1 từ MBR</text>
<line x1="260.0" y1="306" x2="260.0" y2="329" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="277.0" x2="496" y2="277.0" stroke="#94a3b8" stroke-dasharray="4 3"/>
<rect x="500" y="252" width="204" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
<text x="602.0" y="274.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#713f12">first 440 bytes</text>
<text x="602.0" y="291.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#854d0e">440 byte đầu của ổ đầu tiên</text>
<rect x="40" y="332" width="440" height="58" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="64" cy="361.0" r="13" fill="#2563eb"/><text x="64" y="366.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="284.0" y="358.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Stage 2: boot menu</text>
<text x="284.0" y="378.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Giai đoạn 2: hiện menu khởi động</text>
<line x1="260.0" y1="390" x2="260.0" y2="413" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="416" width="440" height="58" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="64" cy="445.0" r="13" fill="#2563eb"/><text x="64" y="450.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">5</text>
<text x="284.0" y="442.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Load the kernel</text>
<text x="284.0" y="462.0" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Nạp kernel</text>
</svg>
