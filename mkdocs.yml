site_name: VietNote15t12
site_url: https://viet15t12.github.io/VietNote15t12/
repo_url: https://github.com/viet15t12/VietNote15t12
repo_name: viet15t12/VietNote15t12
site_description: Study notes (LPIC, CCNA, AWS, PTIT) - English by default, with prepared Vietnamese translation where available

theme:
  name: material
  language: en
  logo: assets/img/logo.svg
  favicon: assets/img/favicon.svg
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - search.highlight
    - search.suggest
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/bilingual.py
  - hooks/course_isolation.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/viet15t12/VietNote15t12
      name: VietNote15t12 (mã nguồn web)
    - icon: material/bank-outline
      link: https://github.com/viet15t12/TurtleDeck_exam
      name: TurtleDeck Exam - ngân hàng đề thi
    - icon: material/cards-outline
      link: https://github.com/viet15t12/TurtleDeck
      name: TurtleDeck - app luyện tập

extra_css:
  - assets/theme.css
  - assets/bilingual.css

extra_javascript:
  - assets/bilingual.js
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Menu của web. Thêm file md mới vào docs/ rồi khai báo thêm một dòng ở đây.
# (Mỗi thư mục môn có index.md làm trang đầu của tab.)
nav:
  - Home: index.md
  - LPIC-1:
      - lpic/index.md
      - "101.1 Hardware settings": lpic/101-1-hardware.md
      - "101.2 Boot the system": lpic/101-2-boot-the-system.md
  - CCNA:
      - ccna/index.md
  - AWS:
      - aws/index.md
  - PTIT:
      - ptit/index.md
      - Kiến trúc máy tính:
          - "Công thức & Bài tập ôn tập": ptit/ktmt/tong_hop_cong_thuc_va_dang_bai_ktmt.md
      - Vi xử lý:
          - "Chương 2: Cấu trúc bộ vi xử lý": ptit/vi_xu_ly/chapter_2_summary.md
      - Toán rời rạc:
          - ptit/toan_roi_lac/index.md
          - "Chương 1: Tổ hợp, Thuật toán & Logic": ptit/toan_roi_lac/chuong-1-to-hop-va-logic.md
          - "Chương 2: Khái niệm & Biểu diễn đồ thị": ptit/toan_roi_lac/chuong-2-do-thi-va-bieu-dien.md
          - "Chương 3: Đồ thị Euler & Hamilton": ptit/toan_roi_lac/chuong-3-do-thi-euler-va-hamilton.md
  - "Ngân hàng đề thi": https://github.com/viet15t12/TurtleDeck_exam
  - "App luyện tập": https://github.com/viet15t12/TurtleDeck
