site_name: VietNote15t12
site_url: https://viet15t12.github.io/VietNote15t12/
repo_url: https://github.com/viet15t12/VietNote15t12
repo_name: viet15t12/VietNote15t12
site_description: Study notes (LPIC, CCNA, AWS, PTIT) - English by default, with prepared Vietnamese translation where available

theme:
  name: material
  language: en
  logo: assets/img/logo.svg
  favicon: assets/img/favicon.svg
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - search.highlight
    - search.suggest
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/bilingual.py

extra_css:
  - assets/theme.css
  - assets/bilingual.css

extra_javascript:
  - assets/bilingual.js

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Menu của web. Thêm file md mới vào docs/ rồi khai báo thêm một dòng ở đây.
# (Mỗi thư mục môn có index.md làm trang đầu của tab.)
nav:
  - Home: index.md
  - LPIC-1:
      - lpic/index.md
      - "101.1 Hardware settings": lpic/101-1-hardware.md
  - CCNA:
      - ccna/index.md
  - AWS:
      - aws/index.md
  - PTIT:
      - ptit/index.md
